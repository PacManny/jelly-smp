services:
  mc:
    image: itzg/minecraft-server
    environment:
      ALLOW_FLIGHT: true
      DIFFICULTY: NORMAL
      ENABLE_RCON: TRUE
      MEMORY: 8G
      GID: 1000
      MODE: SURVIVAL
      EULA: true
      TYPE: NEOFORGE
      VERSION: 26.3
      NEOFORGE_VERSION: 26.3.0.95
    ports:
      - "25565:25565"
    volumes:
      - /home/pacmanny/minecraft-modded-test-server:/data
volumes:
  mc: {}
